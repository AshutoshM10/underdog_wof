<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underdog Woof</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#dcdad5; --accent:#2f5bd3; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e21; --fg:#ececee; --muted:#9a9aa1; --line:#333338; --accent:#7b9cff; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; }
  textarea { width:100%; min-height:140px; resize:vertical; padding:12px; font:inherit; color:inherit;
             background:transparent; border:1px solid var(--line); border-radius:8px; }
  textarea:focus, select:focus, input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .count { text-align:right; font-size:.8rem; color:var(--muted); margin-top:4px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; align-items:flex-end; }
  .row > div { flex:1 1 140px; }
  select, input[type=number] { width:100%; padding:8px; font:inherit; color:inherit; background:var(--card);
                               border:1px solid var(--line); border-radius:8px; }
  input[type=range] { width:100%; }
  button { padding:10px 22px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0;
           border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:progress; }
  .examples { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .examples button { background:transparent; color:var(--accent); border:1px solid var(--line); font-weight:500;
                     padding:4px 10px; font-size:.85rem; }
  #out { margin-top:20px; }
  audio { width:100%; }
  .meta { font-size:.85rem; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .meta a { color:var(--accent); }
  .error { color:var(--err); margin-top:12px; }
  footer { margin-top:24px; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Underdog Woof</h1>
  <p class="sub">English text-to-speech, running locally on your CPU.</p>

  <div class="card">
    <label for="text">Text</label>
    <textarea id="text" maxlength="2000">Your order ships on March 3rd. Call 415-555-0199 with questions.</textarea>
    <div class="count"><span id="count">0</span> / 2000</div>
    <div class="examples" aria-label="Example sentences">
      <button type="button" data-t="Please call me back at 415-555-0199 before 5:30 p.m. on Friday.">Phone &amp; time</button>
      <button type="button" data-t="The total is $1,249.99, and your tracking code is QX-4471.">Money &amp; codes</button>
      <button type="button" data-t="Hey! Thanks for calling. How can I help you today?">Greeting</button>
    </div>

    <div class="row">
      <div>
        <label for="voice">Voice</label>
        <select id="voice"><option value="juno">Juno</option><option value="mira">Mira</option></select>
      </div>
      <div>
        <label for="seed">Seed</label>
        <input id="seed" type="number" value="0" step="1">
      </div>
      <div>
        <label for="temp">Temperature: <span id="tempv">0.50</span></label>
        <input id="temp" type="range" min="0.1" max="1.0" step="0.05" value="0.5">
      </div>
      <div style="flex:0 0 auto"><button id="go" type="button">Speak</button></div>
    </div>

    <div id="err" class="error" role="alert"></div>
    <div id="out" hidden>
      <audio id="player" controls></audio>
      <div class="meta"><span id="stats"></span><a id="dl" download="woof.wav">Download WAV</a></div>
    </div>
  </div>

  <footer>Voice by Underdog Woof. Ctrl/Cmd + Enter to speak. First request per voice loads the model.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const text = $("text"), go = $("go");
const upd = () => $("count").textContent = text.value.length;
text.addEventListener("input", upd); upd();
$("temp").addEventListener("input", e => $("tempv").textContent = (+e.target.value).toFixed(2));
document.querySelectorAll(".examples button").forEach(b => b.onclick = () => { text.value = b.dataset.t; upd(); });
text.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) speak(); });
go.onclick = speak;

let url;
async function speak() {
  if (go.disabled) return;
  $("err").textContent = "";
  go.disabled = true; go.textContent = "Speaking…";
  try {
    const r = await fetch("/tts", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.value, voice: $("voice").value, seed: +$("seed").value || 0, temp: +$("temp").value }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const blob = await r.blob();
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(blob);
    $("player").src = url; $("dl").href = url;
    const a = +r.headers.get("X-Audio-Seconds"), el = +r.headers.get("X-Elapsed-Seconds");
    $("stats").textContent = `${a.toFixed(2)} s audio in ${el.toFixed(2)} s (${(a / el).toFixed(1)}x real time)`;
    $("out").hidden = false;
    $("player").play().catch(() => {});
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    go.disabled = false; go.textContent = "Speak";
  }
}
</script>
</body>
</html>
